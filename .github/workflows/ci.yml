name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sss_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Packaging smoke test (pack, install in a temp project, import, typecheck)
        run: node scripts/pack-smoke.mjs
      - name: Example app (typecheck and build; no Stripe or Supabase needed)
        working-directory: examples/nextjs-supabase
        run: |
          npm ci
          npm run typecheck
          npm run build

  # A clean clone with NO DATABASE_URL: the tests start their own embedded Postgres.
  clean-clone-embedded-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: No DATABASE_URL is set
        run: test -z "${DATABASE_URL:-}"
      - run: npm ci
      - run: npm run check
